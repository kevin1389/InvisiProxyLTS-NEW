	<!-- Face button shadows -->
	<g fill="#293543" filter="url(#soft)">
		<circle cx="356" cy="160" r="27" />
		<circle cx="304" cy="211" r="27" />
		<circle cx="408" cy="211" r="27" />
		<circle cx="356" cy="262" r="27" />
	</g>
	<!-- Face buttons -->
	<circle cx="356" cy="152" r="27" fill="#fdc22b" />
	<circle cx="304" cy="203" r="27" fill="#f04136" />
	<circle cx="408" cy="203" r="27" fill="#2dbe5e" />
	<circle cx="356" cy="254" r="27" fill="#2ba4ee" />
