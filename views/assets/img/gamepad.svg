			C 446 402 424 434 396 442
			C 368 450 342 440 330 412
			C 320 388 310 352 298 340
			C 286 328 272 324 256 324
			C 240 324 226 328 214 340
			C 202 352 192 388 182 412
			C 170 440 144 450 116 442
			C 88 434 66 402 50 374
			C 28 336 18 280 20 218
			C 22 156 48 116 84 102
