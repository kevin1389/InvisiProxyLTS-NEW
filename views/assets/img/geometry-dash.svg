<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
	<defs>
		<linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe14a" />
			<stop offset="1" stop-color="#ff9a1f" />
		</linearGradient>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#17657f" />
			<stop offset="1" stop-color="#0c4457" />
		</linearGradient>
		<linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffdf3e" />
			<stop offset="0.55" stop-color="#ffb01f" />
			<stop offset="1" stop-color="#ff8a12" />
		</linearGradient>
		<linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#8df6fc" />
			<stop offset="1" stop-color="#1fc4dd" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="10" />
		</filter>
		<filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="6" />
		</filter>
	</defs>
	<!-- Outer halo -->
	<rect x="22" y="22" width="468" height="468" rx="100" fill="#ffc93d" opacity="0.55" filter="url(#glow)" />
	<!-- Frame -->
	<rect x="26" y="26" width="460" height="460" rx="96" fill="none" stroke="url(#frame)" stroke-width="34" />
	<!-- Teal face -->
	<rect x="48" y="48" width="416" height="416" rx="78" fill="url(#bg)" />
	<!-- Faint background blocks -->
	<g fill="#0a3c4d" opacity="0.35">
		<rect x="70" y="80" width="120" height="90" rx="10" />
		<rect x="330" y="66" width="120" height="130" rx="10" />
		<rect x="66" y="300" width="140" height="140" rx="10" />
		<rect x="300" y="330" width="150" height="120" rx="10" />
	</g>
	<g fill="#2b7f9b" opacity="0.28">
		<rect x="210" y="60" width="90" height="70" rx="8" />
		<rect x="230" y="380" width="60" height="70" rx="8" />
	</g>
	<!-- Main diamond -->
	<rect x="112" y="78" width="300" height="300" rx="16" transform="rotate(44 262 228)" fill="url(#diamond)" stroke="#101010" stroke-width="13" />
	<!-- Face: eyes -->
	<rect x="168" y="176" width="54" height="54" rx="6" transform="rotate(45 195 203)" fill="url(#mouth)" stroke="#101010" stroke-width="9" />
	<rect x="278" y="128" width="54" height="54" rx="6" transform="rotate(45 305 155)" fill="url(#mouth)" stroke="#101010" stroke-width="9" />
	<!-- Face: mouth -->
	<rect x="246" y="236" width="150" height="52" rx="26" transform="rotate(42 321 262)" fill="url(#mouth)" stroke="#101010" stroke-width="10" />
	<!-- Spike triangle, bottom-left, with glow -->
	<polygon points="58,462 158,300 258,462" fill="none" stroke="#ffffff" stroke-width="12" filter="url(#tglow)" opacity="0.9" />
	<polygon points="58,462 158,300 258,462" fill="#0d0d0d" stroke="#ffffff" stroke-width="7" />
	<!-- Corner badge letter -->
	<text x="40" y="104" font-family="Arial Black, Arial, sans-serif" font-size="76" font-weight="900" fill="#101010">R</text>
</svg>
